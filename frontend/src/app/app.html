  <div class="container-fluid">
    <a class="navbar-brand" href="#">{{ title() }}</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link active" href="#">
            <i class="bi bi-plus-circle me-1"></i>Create Order

<div class="container my-4">
  <div class="row">
    <div class="col-12">
      <div class="card shadow">
        <div class="card-header bg-white">
          <h3 class="card-title mb-0">Order Details</h3>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover">
              <thead class="table-light">
                <tr>
                  <th>Order Name</th>
                  <th>Price</th>
                  <th>Order Status</th>
                  <th>Customer</th>
                  <th>Updated At</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let order of orders">
                  <td>{{ order.orderDetail }}</td>
                  <td>${{ order.price }}</td>
                  <td><span class="badge" [ngClass]="getStatusClass(order.orderStatusName)">{{ order.orderStatusName }}</span></td>
                  <td>{{ order.customerName }}</td>
                  <td>{{ order.updatedAt || 'N/A' }}</td>
                  <td>...</td>
                </tr>
              </tbody>
            </table>
          </div>
          
       
        </div>
      </div>
    </div>
  </div>
</div>
