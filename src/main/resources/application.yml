server:
  port: 8080

spring:
  application:
    name: mindbase
  
  datasource:
    url: jdbc:mysql://${DATASOURCE_URL:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:food}
    username: ${DATABASE_USERNAME:admin}
    password: ${DATABASE_PASSWORD:123456789}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info